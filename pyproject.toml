[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pactlyn"
version = "0.1.0"
description = "A local-first personal AI agent for remembering commitments and following through."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Pactlyn contributors" }]
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "cryptography>=43,<51",
  "keyring>=25,<26",
  "langgraph>=0.2,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PySide6>=6.7,<7",
  "qdrant-client>=1.10,<2",
  "python-dateutil>=2.9,<3",
  "resend>=2.5,<3",
  "SQLAlchemy>=2.0,<3",
  # Document Intelligence (Phase 1+)
  "docling>=2.0,<3",
  "pymupdf>=1.24,<2",
  "pypdfium2>=5.0",
  "pillow>=10.0,<14",
  # Document Intelligence - OCR (Phase 2+)
  "paddleocr>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "coverage>=7.6,<8",
  "ruff>=0.6,<1",
  "types-python-dateutil>=2.9,<3",
]

[project.scripts]
pactlyn = "pactlyn.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pactlyn"]
artifacts = ["src/pactlyn/ui/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: requires explicit external service credentials and may send a test email",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
# Check with the recommended Python 3.12+ environment. The runtime package
# still supports Python 3.11; newer third-party stubs (for example numpy 2.5)
# use syntax that mypy refuses to parse when targeting 3.11.
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["pactlyn"]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "types-python-dateutil>=2.9,<3",
]
